<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>FriendGroup Backup Chat</title>
    <style>
        body { background: #313338; color: #dcddde; font-family: sans-serif; display: flex; flex-direction: column; height: 100vh; margin: 0; }
        #chat-box { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 10px; }
        .msg { background: #2b2d31; padding: 10px; border-radius: 8px; border-left: 4px solid #5865f2; }
        .user { font-weight: bold; color: #fff; display: block; font-size: 0.9em; margin-bottom: 4px; }
        #input-area { padding: 20px; background: #232428; display: flex; gap: 10px; }
        input { flex: 1; padding: 12px; border-radius: 5px; border: none; background: #383a40; color: white; }
        button { padding: 10px 20px; background: #5865f2; color: white; border: none; border-radius: 5px; cursor: pointer; }
    </style>
</head>
<body>

    <div id="chat-box"></div>

    <div id="input-area">
        <input type="text" id="username" placeholder="Your Name" style="width: 100px; flex: none;">
        <input type="text" id="message" placeholder="Type a backup message...">
        <button id="sendBtn">Send</button>
    </div>

    <script type="module">
        // Import the functions you need from the SDKs
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, query, orderBy, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // --- PASTE YOUR FIREBASE CONFIG CODE BELOW ---
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_PROJECT.firebaseapp.com",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_PROJECT.appspot.com",
            messagingSenderId: "YOUR_ID",
            appId: "YOUR_APP_ID"
        };
        // --- PASTE YOUR FIREBASE CONFIG CODE ABOVE ---

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const messagesCol = collection(db, "messages");

        // Send Message
        const sendBtn = document.getElementById('sendBtn');
        const msgInput = document.getElementById('message');
        const nameInput = document.getElementById('username');

        sendBtn.onclick = async () => {
            if(msgInput.value !== "" && nameInput.value !== "") {
                await addDoc(messagesCol, {
                    user: nameInput.value,
                    text: msgInput.value,
                    createdAt: serverTimestamp()
                });
                msgInput.value = "";
            }
        };

        // Listen for Messages (Realtime!)
        const q = query(messagesCol, orderBy("createdAt", "asc"));
        onSnapshot(q, (snapshot) => {
            const chatBox = document.getElementById('chat-box');
            chatBox.innerHTML = "";
            snapshot.forEach((doc) => {
                const data = doc.data();
                const div = document.createElement('div');
                div.className = "msg";
                div.innerHTML = `<span class="user">${data.user}</span>${data.text}`;
                chatBox.appendChild(div);
            });
            chatBox.scrollTop = chatBox.scrollHeight;
        });
    </script>
</body>
</html>
